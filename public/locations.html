<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Discovery — MediKit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="app-main">
      <header class="app-topbar" id="topbar-container"></header>

      <main class="app-content">
        <!-- Search & Discovery Controls -->
        <div class="card" style="margin-bottom: 24px;">
          <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 260px; position: relative;">
              <input type="text" id="location-city-input" class="form-control" placeholder="Enter City, Area, or Postal Code (e.g. Metropolis)...">
            </div>
            <button id="location-search-btn" class="btn btn-primary">
              <i data-lucide="search" style="width: 16px; height: 16px;"></i> Search Area
            </button>
            <button id="use-geolocation-btn" class="btn btn-secondary">
              <i data-lucide="crosshair" style="width: 16px; height: 16px;"></i> Use Current Location
            </button>
          </div>
        </div>

        <!-- Medicine Stock Search Bar (Pharmacy Catalog Query) -->
        <div class="card" style="margin-bottom: 24px; background: #f0fdfa; border-color: rgba(13,148,136,0.3);">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
            <i data-lucide="pill" style="width: 20px; height: 20px; color: var(--primary-teal);"></i>
            <h3 style="font-size: 1rem; color: var(--primary-navy); font-weight: 700;">Find Medicine Availability in Verified Pharmacies</h3>
          </div>
          <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="medicine-search-input" class="form-control" placeholder="Search by medicine name (e.g. Lisinopril, Metformin, Lipitor, Advil)..." style="flex: 1; min-width: 260px;">
            <button id="medicine-search-btn" class="btn btn-primary">
              <i data-lucide="search" style="width: 16px; height: 16px;"></i> Check Pharmacy Stock
            </button>
          </div>
          <div id="medicine-search-results" style="margin-top: 14px;"></div>
        </div>

        <!-- Category View Switcher -->
        <div style="display: flex; gap: 12px; margin-bottom: 20px;">
          <button id="tab-btn-pharmacies" class="btn btn-primary" onclick="switchLocationTab('pharmacies')">
            <i data-lucide="store" style="width: 16px; height: 16px;"></i> Nearby Pharmacies
          </button>
          <button id="tab-btn-hospitals" class="btn btn-secondary" onclick="switchLocationTab('hospitals')">
            <i data-lucide="heart-pulse" style="width: 16px; height: 16px;"></i> Hospitals & Emergency Centers
          </button>
        </div>

        <!-- Tab 1: Pharmacies View -->
        <div id="pharmacies-view">
          <div id="pharmacies-results-container">
            <p style="color: var(--text-muted); padding: 16px;">Discovering nearby pharmacies...</p>
          </div>
        </div>

        <!-- Tab 2: Hospitals View -->
        <div id="hospitals-view" style="display: none;">
          <div id="hospitals-results-container">
            <p style="color: var(--text-muted); padding: 16px;">Discovering healthcare facilities...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/locations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initLocationsPage();
    });
  </script>
</body>
</html>
