<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caregiver Dashboard — MediKit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="app-main">
      <header class="app-topbar" id="topbar-container"></header>

      <main class="app-content">
        <!-- Patient Selector & Permissions Bar -->
        <div class="card" style="margin-bottom: 24px; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
          <div style="display: flex; align-items: center; gap: 14px;">
            <label for="caregiver-patient-select" style="font-weight: 700; color: var(--primary-navy); font-size: 0.95rem;">
              Monitoring Patient:
            </label>
            <select id="caregiver-patient-select" class="form-select" style="width: auto; min-width: 260px;">
              <option value="">Loading assigned patients...</option>
            </select>
          </div>
          <div id="caregiver-permission-notice"></div>
        </div>

        <div id="caregiver-content-area">
          <!-- Stat Metrics for Selected Patient -->
          <div class="grid-2" style="margin-bottom: 24px;">
            <div class="stat-card">
              <div class="stat-icon emerald">
                <i data-lucide="award" style="width: 26px; height: 26px;"></i>
              </div>
              <div>
                <div class="stat-value" id="caregiver-adherence-rate">--%</div>
                <div class="stat-label">30-Day Medication Adherence Score</div>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon amber">
                <i data-lucide="alert-triangle" style="width: 26px; height: 26px;"></i>
              </div>
              <div>
                <div class="stat-value" id="caregiver-missed-count">0</div>
                <div class="stat-label">Missed Doses in the Past 30 Days</div>
              </div>
            </div>
          </div>

          <!-- Selected Patient's Medication Schedule -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">
                <i data-lucide="clock" style="width: 20px; height: 20px; color: var(--primary-teal);"></i>
                <span id="active-patient-name">Patient</span>'s Daily Medication Schedule
              </div>
            </div>
            <div id="caregiver-doses-list">
              <p style="color: var(--text-muted); padding: 16px;">Loading doses...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/caregiver.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCaregiverDashboard();
    });
  </script>
</body>
</html>
